<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner Asistencia · Escuela Villa Las Peñas</title>

  <link rel="manifest" href="./manifest-tablet.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.72rem;
      color: #94a3b8;
    }
    .top-derecha {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reloj {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      background: #0f172a;
      padding: 5px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      letter-spacing: 0.5px;
    }
    .btn-top {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-top:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .btn-instalar-tablet {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      display: none;
    }
    .btn-instalar-tablet:hover {
      background: #0369a1;
    }

    /* Contenedor del video escáner */
    .scanner-wrapper {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 28px;
      overflow: hidden;
      border: 3px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.12);
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    #video.espejo {
      transform: scaleX(-1);
    }
    #canvas { display: none; }

    /* Cuadro de enfoque */
    .visor-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 250px; height: 250px;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .visor-box::before, .visor-box::after,
    .visor-box span::before, .visor-box span::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-color: #38bdf8;
      border-style: solid;
    }
    .visor-box::before { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 14px; }
    .visor-box::after  { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 14px; }
    .visor-box span::before { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 14px; }
    .visor-box span::after  { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 14px; }

    .linea-laser {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 14px #38bdf8;
      top: 10%;
      animation: scanLaser 2.2s ease-in-out infinite alternate;
    }
    @keyframes scanLaser {
      0% { top: 10%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0.3; }
    }

    /* Barra de estado */
    .status-bar {
      width: 100%;
      max-width: 540px;
      margin-top: 14px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: blink 1.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Switch de forzar salida */
    .modo-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px; height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 20px; width: 20px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #f59e0b; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Overlay animado de resultado */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .overlay.show { display: flex; }

    .result-card {
      width: 100%;
      max-width: 480px;
      border-radius: 36px;
      padding: 42px 30px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,0.85);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .result-card.entrada {
      background: radial-gradient(circle at top, #15803d 0%, #052e16 100%);
      border-color: #4ade80;
    }
    .result-card.salida {
      background: radial-gradient(circle at top, #0369a1 0%, #082f49 100%);
      border-color: #38bdf8;
    }
    .result-card.warn {
      background: radial-gradient(circle at top, #b45309 0%, #451a03 100%);
      border-color: #fbbf24;
    }
    .result-card.error {
      background: radial-gradient(circle at top, #b91c1c 0%, #450a0a 100%);
      border-color: #f87171;
    }

    .res-icon { font-size: 5rem; margin-bottom: 12px; }
    .res-tipo {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      opacity: 0.95;
    }
    .res-nombre {
      font-size: 1.85rem;
      font-weight: 900;
      color: white;
      margin: 16px 0 18px;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .res-hora {
      display: inline-block;
      font-size: 2rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 24px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .res-msg {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.45;
      max-width: 380px;
      margin: 0 auto;
    }

    .btn-cerrar-overlay {
      margin-top: 26px;
      padding: 12px 38px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .btn-cerrar-overlay:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <img src="./icons/icon-192.png" alt="Logo">
      <div>
        <div class="brand-title">Control de Asistencia</div>
        <div class="brand-sub">Escáner de Portería</div>
      </div>
    </div>
    <div class="top-derecha">
      <button id="btn-instalar-tablet" class="btn-top btn-instalar-tablet">
        📲 Instalar en Tablet
      </button>
      <div id="reloj" class="reloj">--:--:--</div>
      <button id="btn-toggle-camara" class="btn-top" onclick="alternarCamara()">
        🔄 <span id="label-camara">Frontal</span>
      </button>
    </div>
  </div>

  <div class="scanner-wrapper">
    <video id="video" class="espejo" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="visor-box">
      <span></span>
      <div class="linea-laser"></div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-text">
      <div class="status-dot"></div>
      <span id="status-label">Cámara activa · Acerca tu QR</span>
    </div>
    <div class="modo-toggle">
      <span>Forzar Salida</span>
      <label class="switch">
        <input type="checkbox" id="check-forzar-salida">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Overlay de Resultado -->
  <div id="overlay" class="overlay">
    <div id="result-card" class="result-card entrada">
      <div id="res-icon" class="res-icon">✅</div>
      <div id="res-tipo" class="res-tipo">ENTRADA</div>
      <div id="res-nombre" class="res-nombre">...</div>
      <div id="res-hora" class="res-hora">00:00:00</div>
      <div id="res-msg" class="res-msg">...</div>
      <br>
      <button class="btn-cerrar-overlay" onclick="cerrarOverlay()">Continuar ▶</button>
    </div>
  </div>

  <script src="./js/jsQR.js"></script>
  <script>
    // ── Configuración Supabase ───────────────────────────────────────────────
    const SUPABASE_URL = "https://csjnjitjycbnumzodvvv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QsS5e0fI4PJ90uZfD7vUPA_CxLbz4F6";
    const QR_SECRET_KEY = "eavlp_control_asistencia_secret_2026";
    const TABLA = "asistencia_funcionarios_eventos";

    const HEADERS = {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    // ── Hora y Fecha Basadas 100% en la Tablet ───────────────────────────────
    function obtenerHoraTabletLegible(fechaObj = new Date()) {
      return fechaObj.toLocaleTimeString('es-CL', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }

    function actualizarReloj() {
      document.getElementById('reloj').textContent = obtenerHoraTabletLegible();
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    function obtenerTimestampLocalISO(fechaObj = new Date()) {
      const pad = (n) => String(n).padStart(2, '0');
      const y = fechaObj.getFullYear();
      const m = pad(fechaObj.getMonth() + 1);
      const d = pad(fechaObj.getDate());
      const h = pad(fechaObj.getHours());
      const min = pad(fechaObj.getMinutes());
      const s = pad(fechaObj.getSeconds());

      const offsetMin = -fechaObj.getTimezoneOffset();
      const signo = offsetMin >= 0 ? '+' : '-';
      const offH = pad(Math.floor(Math.abs(offsetMin) / 60));
      const offM = pad(Math.abs(offsetMin) % 60);

      return `${y}-${m}-${d}T${h}:${min}:${s}${signo}${offH}:${offM}`;
    }

    function obtenerFechaHoyTablet() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const y = d.getFullYear();
      const m = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      return { ymd: `${y}${m}${day}`, iso: `${y}-${m}-${day}` };
    }

    // ── Sintetizador de Sonidos ──────────────────────────────────────────────
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function sonarExito() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const gain = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(587.33, now);
        osc1.frequency.setValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc1.connect(gain);
        gain.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);
      } catch (e) {}
    }

    function sonarAlerta() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(330, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    // ── Web Crypto API: Verificar Firma HMAC ──────────────────────────────────
    async function calcularFirma(rut, fechaYYYYMMDD) {
      const enc = new TextEncoder();
      const keyData = enc.encode(QR_SECRET_KEY);
      const msg = enc.encode(rut.trim() + ":" + fechaYYYYMMDD.trim());
      const cryptoKey = await crypto.subtle.importKey(
        "raw", keyData, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", cryptoKey, msg);
      const hex = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
      return hex.slice(0, 16);
    }

    // ── Validar QR del Funcionario ───────────────────────────────────────────
    async function validarQR(payload) {
      const partes = (payload || '').trim().split(':');
      if (partes.length < 3 || partes[0].toUpperCase() !== 'FUNCIONARIO') {
        return { valido: false, msg: 'Código QR no reconocido por el sistema.' };
      }
      const rut = partes[1].trim();
      const fechaQR = partes[2].trim().replace(/-/g, '');
      const firmaQR = partes[3] ? partes[3].trim() : '';

      const hoy = obtenerFechaHoyTablet();
      if (fechaQR !== hoy.ymd) {
        return { valido: false, msg: 'Código QR expirado. El funcionario debe abrir su credencial de hoy.' };
      }

      if (firmaQR) {
        const firmaEsperada = await calcularFirma(rut, fechaQR);
        if (firmaQR !== firmaEsperada) {
          return { valido: false, msg: 'Firma criptográfica inválida. Código QR alterado.' };
        }
      }

      return { valido: true, rut };
    }

    // ── Consultar Supabase ────────────────────────────────────────────────────
    async function obtenerFuncionario(rut) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/funcionarios?rut=eq.${encodeURIComponent(rut)}&select=rut,nombre,estado&limit=1`, { headers: HEADERS });
      const data = await r.json();
      return data && data.length > 0 ? data[0] : null;
    }

    async function obtenerEventosHoy(rut) {
      const hoy = obtenerFechaHoyTablet();
      const desde = `${hoy.iso}T00:00:00`;
      const hasta = `${hoy.iso}T23:59:59`;
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/${TABLA}?funcionario_id=eq.${encodeURIComponent(rut)}&timestamp=gte.${desde}&timestamp=lte.${hasta}&order=timestamp.asc`,
        { headers: HEADERS }
      );
      return (await r.json()) || [];
    }

    async function insertarEvento(rut, tipo) {
      const timestampLocal = obtenerTimestampLocalISO();
      const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLA}`, {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({
          funcionario_id: rut,
          tipo: tipo,
          timestamp: timestampLocal
        })
      });
      if (!r.ok) {
        throw new Error('Error al registrar en Supabase');
      }
      const data = await r.json();
      return Array.isArray(data) ? data[0] : data;
    }

    // ── Lógica de Negocio: Jornada Única Estricta ──────────────────────────────
    async function procesarMarcaje(rut) {
      const func = await obtenerFuncionario(rut);
      if (!func) {
        return { ok: false, tipoClase: 'error', icono: '❌', tipo: 'NO ENCONTRADO', nombre: 'Desconocido', msg: `RUT ${rut} no figura en la nómina oficial.` };
      }
      if ((func.estado || '').toLowerCase() === 'inactivo') {
        return { ok: false, tipoClase: 'error', icono: '⛔', tipo: 'INACTIVO', nombre: func.nombre, msg: 'El funcionario figura como INACTIVO en la escuela.' };
      }

      const eventos = await obtenerEventosHoy(rut);
      const entrada = eventos.find(e => e.tipo === 'entrada');
      const salida = [...eventos].reverse().find(e => e.tipo === 'salida');

      // 1. Anti-Rebote (10s)
      if (eventos.length > 0) {
        const ultimo = eventos[eventos.length - 1];
        const dtUltimo = new Date(ultimo.timestamp);
        if (!isNaN(dtUltimo.getTime())) {
          const difSeg = (Date.now() - dtUltimo.getTime()) / 1000;
          if (difSeg < 10) {
            return {
              ok: false, tipoClase: 'warn', icono: '⏱️', tipo: 'MARCAJE MUY RECIENTE',
              nombre: func.nombre,
              hora: obtenerHoraTabletLegible(),
              msg: `Marcaje registrado hace ${Math.floor(difSeg)}s. Espera unos segundos.`
            };
          }
        }
      }

      // 2. REGLA: Jornada ya completada
      if (entrada && salida) {
        const dtIn = new Date(entrada.timestamp);
        const dtOut = new Date(salida.timestamp);
        const hIn = !isNaN(dtIn.getTime()) ? obtenerHoraTabletLegible(dtIn) : entrada.timestamp.slice(11, 19);
        const hOut = !isNaN(dtOut.getTime()) ? obtenerHoraTabletLegible(dtOut) : salida.timestamp.slice(11, 19);
        return {
          ok: false, tipoClase: 'warn', icono: '🔒', tipo: 'JORNADA FINALIZADA',
          nombre: func.nombre,
          hora: obtenerHoraTabletLegible(),
          msg: `Tu jornada de hoy ya finalizó (Entrada: ${hIn} · Salida: ${hOut}). No se admiten más registros hoy.`
        };
      }

      const forzarSalida = document.getElementById('check-forzar-salida').checked;

      // 3. REGLA: No tiene entrada hoy -> Registrar ENTRADA
      if (!entrada) {
        if (forzarSalida) {
          return {
            ok: false, tipoClase: 'warn', icono: '⚠️', tipo: 'SIN ENTRADA',
            nombre: func.nombre,
            hora: obtenerHoraTabletLegible(),
            msg: 'No puedes registrar salida porque aún no tienes una entrada registrada hoy.'
          };
        }
        await insertarEvento(rut, 'entrada');
        return {
          ok: true, tipoClase: 'entrada', icono: '🟢', tipo: 'ENTRADA',
          nombre: func.nombre,
          hora: obtenerHoraTabletLegible(),
          msg: '¡Bienvenido/a a la Escuela Villa Las Peñas! Entrada registrada exitosamente.'
        };
      }

      // 4. REGLA: Ya tiene entrada hoy -> Evaluar tiempo de permanencia (< 20 min)
      const dtEntrada = new Date(entrada.timestamp);
      let minutosTranscurridos = 999;
      let hEntrada = entrada.timestamp.slice(11, 19);

      if (!isNaN(dtEntrada.getTime())) {
        minutosTranscurridos = (Date.now() - dtEntrada.getTime()) / 60000;
        hEntrada = obtenerHoraTabletLegible(dtEntrada);
      }

      if (!forzarSalida && minutosTranscurridos < 20) {
        return {
          ok: false, tipoClase: 'warn', icono: '🏫', tipo: 'YA EN EL RECINTO',
          nombre: func.nombre,
          hora: hEntrada,
          msg: `Ya registraste tu entrada hoy a las ${hEntrada}. Para retirarte ahora, activa la opción "Forzar Salida" en pantalla.`
        };
      }

      // 5. Registrar SALIDA
      await insertarEvento(rut, 'salida');
      document.getElementById('check-forzar-salida').checked = false;

      return {
        ok: true, tipoClase: 'salida', icono: '🔵', tipo: 'SALIDA',
        nombre: func.nombre,
        hora: obtenerHoraTabletLegible(),
        msg: '¡Hasta pronto! Salida registrada exitosamente. Tu jornada de hoy ha finalizado.'
      };
    }

    // ── Mostrar Resultado en Pantalla ─────────────────────────────────────────
    let overlayTimer = null;

    function mostrarResultado(res) {
      if (res.ok) {
        sonarExito();
      } else {
        sonarAlerta();
      }

      const card = document.getElementById('result-card');
      card.className = 'result-card ' + (res.tipoClase || 'error');

      document.getElementById('res-icon').textContent = res.icono || '❌';
      document.getElementById('res-tipo').textContent = res.tipo || 'RESULTADO';
      document.getElementById('res-nombre').textContent = res.nombre || '';
      document.getElementById('res-hora').textContent = res.hora || obtenerHoraTabletLegible();
      document.getElementById('res-msg').textContent = res.msg || '';

      document.getElementById('overlay').className = 'overlay show';

      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(cerrarOverlay, res.ok ? 4500 : 5500);
    }

    function cerrarOverlay() {
      document.getElementById('overlay').className = 'overlay';
      procesando = false;
      document.getElementById('status-label').textContent = 'Cámara activa · Acerca tu QR';
    }

    // ── Cámara (Frontal por Defecto + Switch) ──────────────────────────────────
    let camaraModo = "user";
    let streamActual = null;
    let procesando = false;
    let ultimoQR = "";
    let ultimoMomentoQR = 0;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    async function iniciarCamara() {
      if (streamActual) {
        streamActual.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: camaraModo, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        streamActual = stream;
        video.srcObject = stream;

        if (camaraModo === "user") {
          video.classList.add("espejo");
          document.getElementById('label-camara').textContent = "Frontal";
        } else {
          video.classList.remove("espejo");
          document.getElementById('label-camara').textContent = "Trasera";
        }

        video.addEventListener('loadedmetadata', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          requestAnimationFrame(scanLoop);
        });
      } catch (err) {
        document.getElementById('status-label').textContent = '❌ Error de cámara: ' + err.message;
      }
    }

    function alternarCamara() {
      camaraModo = (camaraModo === "user") ? "environment" : "user";
      iniciarCamara();
    }

    // ── Bucle de Escaneo Continuo ─────────────────────────────────────────────
    async function scanLoop() {
      if (!procesando && video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

        if (code && code.data) {
          const ahora = Date.now();
          if (code.data !== ultimoQR || (ahora - ultimoMomentoQR) > 3000) {
            ultimoQR = code.data;
            ultimoMomentoQR = ahora;
            procesando = true;
            document.getElementById('status-label').textContent = '⏳ Procesando registro...';
            
            try {
              const val = await validarQR(code.data);
              if (!val.valido) {
                mostrarResultado({
                  ok: false, tipoClase: 'error', icono: '❌', tipo: 'QR INVÁLIDO',
                  nombre: 'Error de Lectura', msg: val.msg
                });
              } else {
                const res = await procesarMarcaje(val.rut);
                mostrarResultado(res);
              }
            } catch (err) {
              mostrarResultado({
                ok: false, tipoClase: 'error', icono: '⚠️', tipo: 'ERROR DE CONEXIÓN',
                nombre: 'Fallo Temporal', msg: 'No se pudo conectar a la base de datos: ' + err.message
              });
            }
          }
        }
      }
      requestAnimationFrame(scanLoop);
    }

    // ── PWA: Instalación en Pantalla de la Tablet ──────────────────────────────
    let deferredPromptTablet = null;
    const btnInstalarTablet = document.getElementById('btn-instalar-tablet');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPromptTablet = e;
      if (btnInstalarTablet) {
        btnInstalarTablet.style.display = 'flex';
      }
    });

    btnInstalarTablet.addEventListener('click', async () => {
      if (deferredPromptTablet) {
        deferredPromptTablet.prompt();
        const { outcome } = await deferredPromptTablet.userChoice;
        if (outcome === 'accepted') {
          btnInstalarTablet.style.display = 'none';
        }
        deferredPromptTablet = null;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
      });
    }

    iniciarCamara();
  </script>
</body>
</html>
